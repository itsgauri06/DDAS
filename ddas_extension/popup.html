<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DDAS Protection</title>

    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 20px;

            padding: 14px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .info {
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="header">
        🛡️ DDAS
    </div>

    <div class="subtitle">
        Download Protection
    </div>

    <div class="status">
        ● PROTECTION ACTIVE
    </div>

    <div class="info">
        DDAS is monitoring browser downloads for
        potentially suspicious file types and
        deceptive filenames.
    </div>

    <div class="footer">
        Security Engine: Ready
    </div>

</html>
